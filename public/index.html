<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alquileres Formosa 🏠</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <h1 class="text-center text-danger mb-4 fw-bold">
        Alquileres Formosa 🏠
      </h1>

      <div
        id="barra-usuario"
        class="alert alert-info d-none justify-content-between align-items-center shadow-sm mb-4"
      >
        <span id="texto-bienvenida" class="fw-bold fs-5"></span>
        <a href="/logout" class="btn btn-outline-danger btn-sm fw-bold"
          >Cerrar Sesión ❌</a
        >
      </div>

      <div class="row g-4 mb-5">
        <div class="col-md-6" id="columna-auth">
          <div
            class="card shadow-sm border-0 border-top border-danger border-4 p-4 mb-4"
          >
            <h3 class="card-title mb-3 fw-bold">Crear Cuenta</h3>
            <form action="/registro" method="POST">
              <div class="mb-2">
                <label class="form-label small fw-semibold">Email</label>
                <input
                  type="email"
                  name="email"
                  class="form-control form-control-sm"
                  required
                />
              </div>
              <div class="mb-2">
                <label class="form-label small fw-semibold">Contraseña</label>
                <input
                  type="password"
                  name="password"
                  class="form-control form-control-sm"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label small fw-semibold"
                  >¿Qué perfil sos?</label
                >
                <select name="rol" class="form-select form-select-sm" required>
                  <option value="cliente">Soy Estudiante (Busco)</option>
                  <option value="dueno">Soy Dueño (Ofrezco)</option>
                </select>
              </div>
              <button type="submit" class="btn btn-danger btn-sm w-100 fw-bold">
                Registrarme
              </button>
            </form>
          </div>

          <div
            class="card shadow-sm border-0 border-top border-primary border-4 p-4"
          >
            <h3 class="card-title mb-3 fw-bold">Iniciar Sesión</h3>
            <form action="/login" method="POST">
              <div class="mb-2">
                <label class="form-label small fw-semibold">Email</label>
                <input
                  type="email"
                  name="email"
                  class="form-control form-control-sm"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label small fw-semibold">Contraseña</label>
                <input
                  type="password"
                  name="password"
                  class="form-control form-control-sm"
                  required
                />
              </div>
              <button
                type="submit"
                class="btn btn-primary btn-sm w-100 fw-bold"
              >
                Ingresar 🚀
              </button>
            </form>
          </div>
        </div>

        <div class="col-md-6">
          <div
            class="card shadow-sm border-0 border-top border-dark border-4 p-4 h-100"
            id="card-publicar"
          >
            <h3 class="card-title mb-4 fw-bold">Publicar Alquiler</h3>

            <div
              id="cartel-bloqueo"
              class="alert alert-warning my-auto text-center"
            >
              🔒 Debes iniciar sesión como <strong>Dueño</strong> para publicar
              una propiedad.
            </div>

            <form
              action="/alquileres"
              method="POST"
              id="form-publicar"
              class="d-none"
            >
              <p class="text-muted small">
                Publicando como: <strong id="email-sesion-publicar"></strong>
              </p>
              <div class="mb-3">
                <label class="form-label fw-semibold">Título del Anuncio</label>
                <input
                  type="text"
                  name="titulo"
                  class="form-control"
                  placeholder="Ej: Monoambiente a estrenar"
                  required
                />
              </div>
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label fw-semibold">Precio ($)</label>
                  <input
                    type="number"
                    name="precio"
                    class="form-control"
                    required
                  />
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label fw-semibold">Barrio</label>
                  <select name="barrio" class="form-select">
                    <option value="Centro">Centro</option>
                    <option value="San Miguel">San Miguel</option>
                    <option value="Guadalupe">Guadalupe</option>
                    <option value="UNaF">Cerca de la UNaF</option>
                  </select>
                </div>
              </div>
              <div class="mb-3 form-check">
                <input
                  type="checkbox"
                  name="tieneAire"
                  value="si"
                  class="form-check-input"
                  id="aire"
                />
                <label class="form-check-label" for="aire"
                  >¿Tiene Aire Acondicionado? ❄️</label
                >
              </div>
              <button type="submit" class="btn btn-dark w-100 fw-bold">
                Publicar Propiedad
              </button>
            </form>
          </div>
        </div>
      </div>

      <hr class="my-5" />

      <div class="card shadow-sm border-0 p-4 mb-4 bg-white">
        <h4 class="fw-bold text-secondary mb-3">🔎 ¿Qué estás buscando hoy?</h4>
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label small fw-semibold text-muted"
              >Filtrar por Barrio</label
            >
            <select
              id="filtro-barrio"
              class="form-select"
              onchange="aplicarFiltros()"
            >
              <option value="Todos">🏡 Todos los barrios</option>
              <option value="Centro">Centro</option>
              <option value="San Miguel">San Miguel</option>
              <option value="Guadalupe">Guadalupe</option>
              <option value="UNaF">Cerca de la UNaF</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label small fw-semibold text-muted"
              >Precio Máximo ($)</label
            >
            <input
              type="number"
              id="filtro-precio"
              class="form-control"
              placeholder="Ej: 200000"
              oninput="aplicarFiltros()"
            />
          </div>
          <div class="col-md-4 d-flex align-items-end">
            <div class="form-check mb-2">
              <input
                type="checkbox"
                id="filtro-aire"
                class="form-check-input"
                onchange="aplicarFiltros()"
              />
              <label
                class="form-check-label fw-semibold text-muted"
                for="filtro-aire"
              >
                Solo con Aire Acondicionado ❄️
              </label>
            </div>
          </div>
        </div>
      </div>

      <h2 class="mb-4 fw-bold text-secondary">
        Alquileres Disponibles en Formosa
      </h2>
      <div id="contenedor-alquileres" class="row g-4">
        <p class="text-muted">Cargando alquileres de la base de datos...</p>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>

    <script>
      let todosLosAlquileres = [];
      let usuarioActual = null;

      // 1. Verificar el estado de la sesión
      async function verificarSesion() {
        try {
          const res = await fetch("/quien-soy");
          const info = await res.json();

          const barraUsuario = document.getElementById("barra-usuario");
          const textoBienvenida = document.getElementById("texto-bienvenida");
          const columnaAuth = document.getElementById("columna-auth");
          const cartelBloqueo = document.getElementById("cartel-bloqueo");
          const formPublicar = document.getElementById("form-publicar");
          const emailSesionPublicar = document.getElementById(
            "email-sesion-publicar",
          );

          if (info.logueado) {
            usuarioActual = info.usuario;
            columnaAuth.classList.add("d-none");
            barraUsuario.classList.remove("d-none");
            barraUsuario.classList.add("d-flex");
            textoBienvenida.innerText = `¡Hola, ${info.usuario.email} (${info.usuario.rol.toUpperCase()})! 👋`;

            if (info.usuario.rol === "dueno") {
              cartelBloqueo.classList.add("d-none");
              formPublicar.classList.remove("d-none");
              emailSesionPublicar.innerText = info.usuario.email;
            } else {
              cartelBloqueo.innerHTML =
                "ℹ️ Estás logueado como <strong>Estudiante</strong>. Podés usar los filtros abajo para buscar tu depto ideal.";
            }
          } else {
            usuarioActual = null;
            columnaAuth.classList.remove("d-none");
            barraUsuario.classList.add("d-none");
          }
        } catch (e) {
          console.error("Error verificando sesión", e);
        }
        obtenerAlquileres();
      }

      // 2. Traer los alquileres del backend
      async function obtenerAlquileres() {
        try {
          const respuesta = await fetch("/alquileres");
          todosLosAlquileres = await respuesta.json();
          dibujarTarjetas(todosLosAlquileres);
        } catch (error) {
          console.error("Error al cargar alquileres:", error);
        }
      }

      // Filtra el array global y vuelve a dibujar la pantalla
      function aplicarFiltros() {
        const barrioSeleccionado =
          document.getElementById("filtro-barrio").value;
        const precioMaximo = document.getElementById("filtro-precio").value;
        const soloConAire = document.getElementById("filtro-aire").checked;

        const alquileresFiltrados = todosLosAlquileres.filter((alquiler) => {
          const cumpleBarrio =
            barrioSeleccionado === "Todos" ||
            alquiler.barrio === barrioSeleccionado;
          const cumplePrecio =
            !precioMaximo || alquiler.precio <= Number(precioMaximo);
          const cumpleAire = !soloConAire || alquiler.tieneAire === true;
          return cumpleBarrio && cumplePrecio && cumpleAire;
        });

        dibujarTarjetas(alquileresFiltrados);
      }

      // Encargada de meter las cards en el HTML
      function dibujarTarjetas(lista) {
        const contenedor = document.getElementById("contenedor-alquileres");
        contenedor.innerHTML = "";

        if (lista.length === 0) {
          contenedor.innerHTML =
            '<div class="col-12"><p class="alert alert-warning text-center">No encontramos alquileres que coincidan con tu búsqueda, Rey. 🔍</p></div>';
          return;
        }

        lista.forEach((alquiler) => {
          // 🔥 MODIFICACIÓN: Agregamos botones de Editar y Borrar juntos si es el dueño
          let accionesDuenoHtml = "";
          if (usuarioActual && usuarioActual.email === alquiler.dueno) {
            accionesDuenoHtml = `
                        <div class="mt-3 d-flex gap-2">
                            <button onclick="modificarPrecio(${alquiler.id}, ${alquiler.precio})" class="btn btn-sm btn-warning w-50 fw-bold text-dark">Editar Precio ✏️</button>
                            
                            <form action="/alquileres/borrar" method="POST" class="w-50">
                                <input type="hidden" name="idAlquiler" value="${alquiler.id}">
                                <button type="submit" class="btn btn-sm btn-danger w-100 fw-bold">Borrar 🗑️</button>
                            </form>
                        </div>
                    `;
          }

          contenedor.innerHTML += `
                    <div class="col-md-4">
                        <div class="card h-100 shadow-sm border-0">
                            <div class="card-body">
                                <span class="badge bg-danger mb-2">Barrio ${alquiler.barrio}</span>
                                <h5 class="card-title fw-bold">${alquiler.titulo}</h5>
                                <p class="card-text text-success fs-4 fw-bold">$${alquiler.precio.toLocaleString("es-AR")}</p>
                                <p class="card-text text-muted mb-2">
                                    ${alquiler.tieneAire ? "❄️ Tiene Aire Acondicionado" : "💨 Ventilador de techo"}
                                </p>
                                ${accionesDuenoHtml} 
                            </div>
                            <div class="card-footer bg-transparent border-0 text-muted small pb-3">
                                👤 Publicado por: ${alquiler.dueno}
                            </div>
                        </div>
                    </div>
                `;
        });
      }

      // 🔥 NUEVA FUNCIÓN FRONTEND: Abre la cajita y le avisa al backend
      async function modificarPrecio(id, precioActual) {
        const nuevoPrecio = prompt(
          `El precio actual es $${precioActual.toLocaleString("es-AR")}.\n¿Cuál es el nuevo precio que querés poner?`,
          precioActual,
        );

        // Si el usuario canceló o no puso nada, nos vamos
        if (nuevoPrecio === null || nuevoPrecio.trim() === "") return;

        if (isNaN(nuevoPrecio) || Number(nuevoPrecio) <= 0) {
          alert("Por favor, ingresá un número de precio válido.");
          return;
        }

        try {
          // Mandamos la info al backend en formato URL-Encoded igual que un formulario tradicional
          const respuesta = await fetch("/alquileres/editar-precio", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: `idAlquiler=${id}&nuevoPrecio=${nuevoPrecio}`,
          });

          const resultado = await respuesta.json();

          if (resultado.exito) {
            // Si el servidor guardó todo bien, volvemos a pedir la lista para refrescar la pantalla
            verificarSesion();
          } else {
            alert("Error: " + resultado.error);
          }
        } catch (error) {
          console.error("Error al editar:", error);
          alert("Hubo un error de conexión al intentar editar el precio.");
        }
      }

      verificarSesion();
    </script>
  </body>
</html>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alquileres Formosa 🏠</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .card-img-top {
        height: 200px;
        object-fit: cover;
      }
    </style>
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="text-danger m-0 fw-bold">Alquileres Formosa 🏠</h1>

        <div id="botones-invitado">
          <a href="/login.html" class="btn btn-outline-primary fw-bold me-2"
            >Iniciar Sesión 🚀</a
          >
          <a href="/registro.html" class="btn btn-danger fw-bold"
            >Crear Cuenta</a
          >
        </div>
      </div>

      <div
        id="barra-usuario"
        class="alert alert-info d-none justify-content-between align-items-center shadow-sm mb-4"
      >
        <span id="texto-bienvenida" class="fw-bold fs-5"></span>
        <a href="/logout" class="btn btn-outline-danger btn-sm fw-bold"
          >Cerrar Sesión ❌</a
        >
      </div>

      <div class="row mb-5 d-none" id="seccion-publicar">
        <div class="col-12">
          <div
            class="card shadow-sm border-0 border-top border-dark border-4 p-4"
          >
            <h3 class="card-title mb-4 fw-bold">Publicar un Nuevo Alquiler</h3>
            <form
              action="/alquileres"
              method="POST"
              enctype="multipart/form-data"
            >
              <p class="text-muted small">
                Publicando como: <strong id="email-sesion-publicar"></strong>
              </p>
              <div class="row">
                <div class="col-md-4 mb-3">
                  <label class="form-label fw-semibold"
                    >Título del Anuncio</label
                  >
                  <input
                    type="text"
                    name="titulo"
                    class="form-control"
                    placeholder="Ej: Monoambiente a estrenar"
                    required
                  />
                </div>
                <div class="col-md-2 mb-3">
                  <label class="form-label fw-semibold">Precio ($)</label>
                  <input
                    type="number"
                    name="precio"
                    class="form-control"
                    required
                  />
                </div>
                <div class="col-md-3 mb-3">
                  <label class="form-label fw-semibold">Barrio</label>
                  <select name="barrio" class="form-select">
                    <option value="Centro">Centro</option>
                    <option value="San Miguel">San Miguel</option>
                    <option value="Guadalupe">Guadalupe</option>
                    <option value="UNaF">Cerca de la UNaF</option>
                  </select>
                </div>
                <div class="col-md-3 mb-3">
                  <label class="form-label fw-semibold"
                    >Foto del Inmueble 📸</label
                  >
                  <input
                    type="file"
                    name="foto"
                    class="form-control"
                    accept="image/*"
                    required
                  />
                </div>
              </div>
              <div
                class="d-flex justify-content-between align-items-center mt-2"
              >
                <div class="form-check">
                  <input
                    type="checkbox"
                    name="tieneAire"
                    value="si"
                    class="form-check-input"
                    id="aire"
                  />
                  <label class="form-check-label" for="aire"
                    >¿Tiene Aire Acondicionado? ❄️</label
                  >
                </div>
                <button type="submit" class="btn btn-dark px-5 fw-bold">
                  Publicar Propiedad
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <div class="card shadow-sm border-0 p-4 mb-4 bg-white">
        <h4 class="fw-bold text-secondary mb-3">🔎 ¿Qué estás buscando hoy?</h4>
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label small fw-semibold text-muted"
              >Filtrar por Barrio</label
            >
            <select
              id="filtro-barrio"
              class="form-select"
              onchange="aplicarFiltros()"
            >
              <option value="Todos">🏡 Todos los barrios</option>
              <option value="Centro">Centro</option>
              <option value="San Miguel">San Miguel</option>
              <option value="Guadalupe">Guadalupe</option>
              <option value="UNaF">Cerca de la UNaF</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label small fw-semibold text-muted"
              >Precio Máximo ($)</label
            >
            <input
              type="number"
              id="filtro-precio"
              class="form-control"
              placeholder="Ej: 200000"
              oninput="aplicarFiltros()"
            />
          </div>
          <div class="col-md-4 d-flex align-items-end">
            <div class="form-check mb-2">
              <input
                type="checkbox"
                id="filtro-aire"
                class="form-check-input"
                onchange="aplicarFiltros()"
              />
              <label
                class="form-check-label fw-semibold text-muted"
                for="filtro-aire"
              >
                Solo con Aire Acondicionado ❄️
              </label>
            </div>
          </div>
        </div>
      </div>

      <h2 class="mb-4 fw-bold text-secondary">
        Alquileres Disponibles en Formosa
      </h2>
      <div id="contenedor-alquileres" class="row g-4">
        <p class="text-muted">Cargando alquileres de la base de datos...</p>
      </div>
    </div>

    <script>
      let todosLosAlquileres = [];
      let usuarioActual = null;

      // 1. Verificar sesión y adaptar la visual
      async function verificarSesion() {
        try {
          const res = await fetch("/quien-soy");
          const info = await res.json();

          const barraUsuario = document.getElementById("barra-usuario");
          const textoBienvenida = document.getElementById("texto-bienvenida");
          const botonesInvitado = document.getElementById("botones-invitado");
          const seccionPublicar = document.getElementById("seccion-publicar");
          const emailSesionPublicar = document.getElementById(
            "email-sesion-publicar",
          );

          if (info.logueado) {
            usuarioActual = info.usuario;

            // Ocultamos los botones de login/registro de arriba
            botonesInvitado.classList.add("d-none");

            // Mostramos bienvenida
            barraUsuario.classList.remove("d-none");
            barraUsuario.classList.add("d-flex");
            textoBienvenida.innerText = `¡Hola, ${info.usuario.email} (${info.usuario.rol.toUpperCase()})! 👋`;

            // Si es dueño, desplegamos la zona de publicación a lo ancho
            if (info.usuario.rol === "dueno") {
              seccionPublicar.classList.remove("d-none");
              emailSesionPublicar.innerText = info.usuario.email;
            }
          } else {
            usuarioActual = null;
            botonesInvitado.classList.remove("d-none");
            barraUsuario.classList.add("d-none");
            seccionPublicar.classList.add("d-none");
          }
        } catch (e) {
          console.error("Error verificando sesión", e);
        }
        obtenerAlquileres();
      }

      async function obtenerAlquileres() {
        try {
          const respuesta = await fetch("/alquileres");
          todosLosAlquileres = await respuesta.json();
          dibujarTarjetas(todosLosAlquileres);
        } catch (error) {
          console.error("Error al cargar alquileres:", error);
        }
      }

      function aplicarFiltros() {
        const barrioSeleccionado =
          document.getElementById("filtro-barrio").value;
        const precioMaximo = document.getElementById("filtro-precio").value;
        const soloConAire = document.getElementById("filtro-aire").checked;

        const alquileresFiltrados = todosLosAlquileres.filter((alquiler) => {
          const cumpleBarrio =
            barrioSeleccionado === "Todos" ||
            alquiler.barrio === barrioSeleccionado;
          const cumplePrecio =
            !precioMaximo || alquiler.precio <= Number(precioMaximo);
          const cumpleAire = !soloConAire || alquiler.tieneAire === true;
          return cumpleBarrio && cumplePrecio && cumpleAire;
        });

        dibujarTarjetas(alquileresFiltrados);
      }

      function dibujarTarjetas(lista) {
        const contenedor = document.getElementById("contenedor-alquileres");
        contenedor.innerHTML = "";

        if (lista.length === 0) {
          contenedor.innerHTML =
            '<div class="col-12"><p class="alert alert-warning text-center">No encontramos alquileres que coincidan con tu búsqueda, Rey. 🔍</p></div>';
          return;
        }

        lista.forEach((alquiler) => {
          let accionesDuenoHtml = "";
          if (usuarioActual && usuarioActual.email === alquiler.dueno) {
            accionesDuenoHtml = `
                        <div class="mt-3 d-flex gap-2">
                            <button onclick="modificarPrecio(${alquiler.id}, ${alquiler.precio})" class="btn btn-sm btn-warning w-50 fw-bold text-dark">Editar Precio ✏️</button>
                            <form action="/alquileres/borrar" method="POST" class="w-50">
                                <input type="hidden" name="idAlquiler" value="${alquiler.id}">
                                <button type="submit" class="btn btn-sm btn-danger w-100 fw-bold">Borrar</button>
                            </form>
                        </div>
                    `;
          }

          contenedor.innerHTML += `
                    <div class="col-md-4">
                        <div class="card h-100 shadow-sm border-0 overflow-hidden">
                            <img src="${alquiler.imagen}" class="card-img-top" alt="Foto">
                            <div class="card-body">
                                <span class="badge bg-danger mb-2">Barrio ${alquiler.barrio}</span>
                                <h5 class="card-title fw-bold">${alquiler.titulo}</h5>
                                <p class="card-text text-success fs-4 fw-bold">$${alquiler.precio.toLocaleString("es-AR")}</p>
                                <p class="card-text text-muted mb-2">
                                    ${alquiler.tieneAire ? "❄️ Tiene Aire Acondicionado" : "💨 Ventilador de techo"}
                                </p>
                                ${accionesDuenoHtml} 
                            </div>
                            <div class="card-footer bg-transparent border-0 text-muted small pb-3">
                                👤 Publicado por: ${alquiler.dueno}
                            </div>
                        </div>
                    </div>
                `;
        });
      }

      async function modificarPrecio(id, precioActual) {
        const nuevoPrecio = prompt(`Nuevo precio:`, precioActual);
        if (nuevoPrecio === null || nuevoPrecio.trim() === "") return;
        try {
          const respuesta = await fetch("/alquileres/editar-precio", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: `idAlquiler=${id}&nuevoPrecio=${nuevoPrecio}`,
          });
          const resultado = await respuesta.json();
          if (resultado.exito) verificarSesion();
        } catch (error) {
          console.error(error);
        }
      }

      verificarSesion();
    </script>
  </body>
</html>

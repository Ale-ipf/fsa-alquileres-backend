<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto - Alquileres Formosa 🏠</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --color-terracota: #9a3412;
        --color-atardecer: #ea580c;
        --color-crema-fondo: #fdfbf7;
      }
      body {
        background-color: var(--color-crema-fondo) !important;
        color: #292524;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      .brand-title {
        color: var(--color-terracota);
        font-weight: 800;
        text-decoration: none;
      }
      .panel-premium {
        border-radius: 12px !important;
        border: none !important;
        background-color: #ffffff;
        box-shadow: 0 4px 6px -1px rgba(124, 45, 18, 0.03);
      }
      .btn-primario {
        background-color: var(--color-terracota);
        color: white;
        border: none;
      }
      .btn-primario:hover {
        background-color: #7c2d12;
        color: white;
      }
      .btn-volver {
        color: var(--color-atardecer);
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="container py-5">
      <div
        class="d-flex justify-content-between align-items-center mb-5 border-bottom pb-3"
      >
        <a href="/" class="brand-title fs-3">Alquileres Formosa 🏠</a>
        <a href="/" class="btn-volver">← Volver al Inicio</a>
      </div>

      <div class="row">
        <div class="col-md-6 mb-4">
          <div class="card panel-premium p-4 shadow-sm h-100">
            <h4 class="fw-bold mb-3" style="color: var(--color-terracota)">
              ✉️ Formulario de Contacto Directo
            </h4>
            <form onsubmit="enviarMensajeContacto(event)">
              <div class="mb-3">
                <label class="form-label small fw-semibold text-muted"
                  >Nombre y Apellido</label
                >
                <input
                  type="text"
                  id="contacto-nombre"
                  class="form-control"
                  placeholder="Ej: Sofia"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label small fw-semibold text-muted"
                  >Correo Electrónico</label
                >
                <input
                  type="email"
                  id="contacto-email"
                  class="form-control"
                  placeholder="tu-correo@ejemplo.com"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label small fw-semibold text-muted"
                  >Mensaje</label
                >
                <textarea
                  id="contacto-mensaje"
                  class="form-control"
                  rows="4"
                  placeholder="Escribí tu consulta acá..."
                  required
                ></textarea>
              </div>
              <button type="submit" class="btn btn-primario w-100 py-2 fw-bold">
                Enviar Mensaje 🚀
              </button>
            </form>
          </div>
        </div>

        <div class="col-md-6 mb-4">
          <div
            class="card panel-premium p-4 shadow-sm h-100 d-flex flex-column justify-content-between"
          >
            <div>
              <h4 class="fw-bold mb-3" style="color: var(--color-terracota)">
                📍 Información y Redes
              </h4>
              <p class="text-muted small mb-1">
                📧 <strong>Email:</strong> soporte@alquileresfsa.com
              </p>
              <p class="text-muted small mb-1">
                📱 <strong>Instagram:</strong> @AlquileresFormosa
              </p>
              <p class="text-muted small mb-3">
                💬 <strong>Atención:</strong> Lun a Vie 8 a 18hs
              </p>
            </div>
            <div
              class="rounded-3 overflow-hidden shadow-sm flex-grow-1"
              style="min-height: 200px"
            >
              <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d57244.38268710776!2d-58.2155829!3d-26.1764654!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9442f066b5c3ffb5%3A0x633513a07206b0d9!2sFormosa!5e0!3m2!1ses-419!2sar!4v1710000000000"
                width="100%"
                height="100%"
                style="border: 0; min-height: 200px"
                allowfullscreen=""
                loading="lazy"
              ></iframe>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      function enviarMensajeContacto(event) {
        event.preventDefault();
        const nombre = document.getElementById("contacto-nombre").value;
        alert(
          `¡Gracias ${nombre}! Tu consulta interactiva fue enviada con éxito.`,
        );
        event.target.reset();
      }
    </script>
  </body>
</html>

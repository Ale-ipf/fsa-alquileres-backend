<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión - Alquileres Formosa</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light d-flex align-items-center vh-100">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-5">
          <div class="text-center mb-4">
            <h2 class="fw-bold text-danger">Alquileres Formosa 🏠</h2>
            <p class="text-muted">Ingresá a tu cuenta para operar</p>
          </div>
          <div
            class="card shadow-sm border-0 border-top border-primary border-4 p-4"
          >
            <h3 class="card-title mb-3 fw-bold fs-4">Iniciar Sesión</h3>
            <form action="/login" method="POST">
              <div class="mb-3">
                <label class="form-label small fw-semibold">Email</label>
                <input
                  type="email"
                  name="email"
                  class="form-control"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label small fw-semibold">Contraseña</label>
                <input
                  type="password"
                  name="password"
                  class="form-control"
                  required
                />
              </div>
              <button type="submit" class="btn btn-primary w-100 fw-bold mb-3">
                Ingresar 🚀
              </button>
            </form>
            <div class="text-center small">
              <span class="text-muted">¿No tenés cuenta?</span>
              <a
                href="/registro.html"
                class="text-danger fw-bold text-decoration-none"
                >Registrate acá</a
              >
            </div>
          </div>
          <div class="text-center mt-3">
            <a href="/" class="text-muted small text-decoration-none"
              >← Volver al inicio</a
            >
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear Cuenta - Alquileres Formosa</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light d-flex align-items-center vh-100">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-5">
          <div class="text-center mb-4">
            <h2 class="fw-bold text-danger">Alquileres Formosa 🏠</h2>
            <p class="text-muted">
              Sumate a la comunidad de alquileres más grande de FSA
            </p>
          </div>
          <div
            class="card shadow-sm border-0 border-top border-danger border-4 p-4"
          >
            <h3 class="card-title mb-3 fw-bold fs-4">Crear Cuenta</h3>
            <form action="/registro" method="POST">
              <div class="mb-2">
                <label class="form-label small fw-semibold">Email</label>
                <input
                  type="email"
                  name="email"
                  class="form-control form-control-sm"
                  required
                />
              </div>
              <div class="mb-2">
                <label class="form-label small fw-semibold">Contraseña</label>
                <input
                  type="password"
                  name="password"
                  class="form-control form-control-sm"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label small fw-semibold"
                  >¿Qué perfil sos?</label
                >
                <select name="rol" class="form-select form-select-sm" required>
                  <option value="cliente">Soy Estudiante (Busco)</option>
                  <option value="dueno">Soy Dueño (Ofrezco)</option>
                </select>
              </div>
              <button type="submit" class="btn btn-danger w-100 fw-bold mb-3">
                Registrarme
              </button>
            </form>
            <div class="text-center small">
              <span class="text-muted">¿Ya tenés cuenta?</span>
              <a
                href="/login.html"
                class="text-primary fw-bold text-decoration-none"
                >Iniciá sesión</a
              >
            </div>
          </div>
          <div class="text-center mt-3">
            <a href="/" class="text-muted small text-decoration-none"
              >← Volver al inicio</a
            >
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
